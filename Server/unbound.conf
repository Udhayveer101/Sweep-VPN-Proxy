# Self-hosted resolver, reachable only over wg0 (see nftables.conf).
# ECS is off, QNAME minimisation on, nothing is logged.
server:
  interface: 10.64.0.1
  interface: fd00:64::1
  access-control: 10.64.0.0/24 allow
  access-control: fd00:64::/64 allow
  access-control: 0.0.0.0/0 refuse
  do-ip6: yes
  hide-identity: yes
  hide-version: yes
  qname-minimisation: strict
  aggressive-nsec: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  harden-below-nxdomain: yes
  use-caps-for-id: yes
  send-client-subnet: []          # never forward EDNS Client Subnet
  cache-min-ttl: 60
  prefetch: yes
  rrset-roundrobin: yes
  verbosity: 0
  log-queries: no
  log-replies: no
  use-syslog: no
