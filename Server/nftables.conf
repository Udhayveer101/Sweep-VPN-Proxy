#!/usr/sbin/nft -f
# Default-deny. The VPS accepts only SSH (rate limited), WireGuard and DNS from
# inside the tunnel. Nothing else — no web panel, no API, no exposed resolver.
flush ruleset

table inet filter {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    ip protocol icmp icmp type { echo-request } limit rate 5/second accept
    ip6 nexthdr icmpv6 accept
    tcp dport 22 ct state new limit rate 6/minute accept
    udp dport 51820 accept
    # Fallback rungs: TLS + QUIC on 443, Shadowsocks-2022 on 8443, plain TCP on 8080.
    tcp dport 443 accept
    udp dport 443 accept
    tcp dport 8443 accept
    tcp dport 8080 accept
    # IKEv2 (kernel rung).
    udp dport { 500, 4500 } accept
    # Resolver is reachable only from inside the tunnel.
    iifname "wg0" udp dport 53 accept
    iifname "wg0" tcp dport 53 accept
    counter drop
  }

  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    # Tunnel -> internet only. Peers cannot reach each other or the LAN.
    iifname "wg0" oifname != "wg0" accept
    counter drop
  }

  chain output {
    type filter hook output priority 0; policy accept;
  }
}

table inet nat {
  chain postrouting {
    type nat hook postrouting priority 100;
    ip saddr 10.64.0.0/24 oifname != "wg0" masquerade
    ip6 saddr fd00:64::/64 oifname != "wg0" masquerade
  }
}
