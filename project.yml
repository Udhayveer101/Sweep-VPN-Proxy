name: SweepVPN
options:
  bundleIdPrefix: com.sweep.vpn
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWEEP_CONFIG_SIGNING_KEY: "wVOJIuoa32ZZ5lSd8RmCaUOEFQIUYmidxFcK8bhYNYA="
    SWEEP_CONFIG_URL: ""
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: P66SB4MX92
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SweepVPNCore: { path: Core }
  SweepVPNKit: { path: Kit }
targets:
  SweepVPN-iOS:
    type: application
    platform: iOS
    sources: [Apps/iOS, Apps/Shared]
    resources:
      - path: Apps/Shared/sweep-config.sig.json
        optional: true
    entitlements: { path: Apps/iOS/App.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.ios
        INFOPLIST_FILE: Apps/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SweepVPN-iOS-Tunnel
        embed: true
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
      - package: SweepVPNKit
        product: SweepVPNUI
  SweepVPN-iOS-Tunnel:
    type: app-extension
    platform: iOS
    sources: [Apps/iOSTunnel, Apps/Shared]
    entitlements: { path: Apps/iOSTunnel/Tunnel.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.ios.tunnel
        INFOPLIST_FILE: Apps/iOSTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
  SweepVPN-macOS:
    type: application
    platform: macOS
    sources: [Apps/macOS, Apps/Shared]
    # A personal build carries its own signed bundle instead of hosting one.
    # `optional: true` keeps the build working before the first fleet is signed.
    resources:
      - path: Apps/Shared/sweep-config.sig.json
        optional: true
    entitlements: { path: Apps/macOS/App.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac
        INFOPLIST_FILE: Apps/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: SweepVPN-macOS-Tunnel
        embed: true
      - target: SweepVPN-macOS-Filter
        embed: true
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
      - package: SweepVPNKit
        product: SweepVPNUI
  SweepVPN-macOS-Filter:
    type: app-extension
    platform: macOS
    sources: [Apps/macOSFilter, Apps/Shared]
    entitlements: { path: Apps/macOSFilter/Filter.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac.filter
        INFOPLIST_FILE: Apps/macOSFilter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit

  SweepVPN-macOS-Tunnel:
    type: app-extension
    platform: macOS
    sources: [Apps/macOSTunnel, Apps/Shared]
    entitlements: { path: Apps/macOSTunnel/Tunnel.entitlements }
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac.tunnel
        INFOPLIST_FILE: Apps/macOSTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
schemes:
  SweepVPN-iOS:
    build: { targets: { SweepVPN-iOS: all } }
  SweepVPN-macOS:
    build: { targets: { SweepVPN-macOS: all } }
