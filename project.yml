name: SweepVPN
options:
  bundleIdPrefix: com.sweep.vpn
  deploymentTarget: { iOS: "17.0", macOS: "14.0" }
  createIntermediateGroups: true
# Everything that is yours rather than the project's — signing team, pinned
# key, your own Worker — lives in Config/Local.xcconfig, which is gitignored.
# `make config` creates it from Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Local.xcconfig
  Release: Config/Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    # DEVELOPMENT_TEAM, SWEEP_CONFIG_SIGNING_KEY, SWEEP_TUNNEL_URL,
    # SWEEP_TUNNEL_TOKEN, SWEEP_RELAY_MIRROR_URL and SWEEP_CONFIG_URL are
    # deliberately *not* set here. A build configuration setting overrides the
    # xcconfig beneath it, so listing them — even as "" — would silently win over
    # Config/Local.xcconfig and every build would come out unconfigured.
    # Undefined expands to empty in the Info.plists, which is the off state.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  SweepVPNCore: { path: Core }
  SweepVPNKit: { path: Kit }
targets:
  SweepVPN-iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
      - Apps/Shared
    postBuildScripts:
      - name: Embed signed config bundle if one exists
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/Config/sweep-config.sig.json"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ -f "$SRC" ]; then
            mkdir -p "$DEST" && cp "$SRC" "$DEST/"
            echo "embedded signed config bundle"
          else
            echo "no signed bundle yet - app will show the setup guide"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.ios
        CODE_SIGN_ENTITLEMENTS: Apps/iOS/App.entitlements
        INFOPLIST_FILE: Apps/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SweepVPN-iOS-Tunnel
        embed: true
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
      - package: SweepVPNKit
        product: SweepVPNUI
  SweepVPN-iOS-Tunnel:
    type: app-extension
    platform: iOS
    sources: [Apps/iOSTunnel, Apps/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.ios.tunnel
        CODE_SIGN_ENTITLEMENTS: Apps/iOSTunnel/Tunnel.entitlements
        INFOPLIST_FILE: Apps/iOSTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
  SweepVPN-macOS:
    type: application
    platform: macOS
    # A personal build carries its own signed bundle instead of hosting one.
    # `optional` keeps a fresh clone building before any bundle is signed.
    sources:
      - Apps/macOS
      - Apps/Shared
    postBuildScripts:
      - name: Embed signed config bundle if one exists
        basedOnDependencyAnalysis: false
        script: |
          SRC="$SRCROOT/Config/sweep-config.sig.json"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          if [ -f "$SRC" ]; then
            mkdir -p "$DEST" && cp "$SRC" "$DEST/"
            echo "embedded signed config bundle"
          else
            echo "no signed bundle yet - app will show the setup guide"
          fi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac
        CODE_SIGN_ENTITLEMENTS: Apps/macOS/App.entitlements
        INFOPLIST_FILE: Apps/macOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - target: SweepVPN-macOS-Tunnel
        embed: true
      - target: SweepVPN-macOS-Filter
        embed: true
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
      - package: SweepVPNKit
        product: SweepVPNUI
  SweepVPN-macOS-Filter:
    type: app-extension
    platform: macOS
    sources: [Apps/macOSFilter, Apps/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac.filter
        CODE_SIGN_ENTITLEMENTS: Apps/macOSFilter/Filter.entitlements
        INFOPLIST_FILE: Apps/macOSFilter/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit

  SweepVPN-macOS-Tunnel:
    type: app-extension
    platform: macOS
    sources: [Apps/macOSTunnel, Apps/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sweep.vpn.mac.tunnel
        CODE_SIGN_ENTITLEMENTS: Apps/macOSTunnel/Tunnel.entitlements
        INFOPLIST_FILE: Apps/macOSTunnel/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: SweepVPNCore
        product: SweepVPNCore
      - package: SweepVPNKit
        product: SweepVPNKit
schemes:
  SweepVPN-iOS:
    build: { targets: { SweepVPN-iOS: all } }
  SweepVPN-macOS:
    build: { targets: { SweepVPN-macOS: all } }
